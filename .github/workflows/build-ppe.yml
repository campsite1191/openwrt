name: Build OpenWrt - PPE-NSS

on:
  workflow_dispatch:
  schedule:
    # Run once a week on Friday morning at 05:00 PDT / 04:00 PST (12:00 UTC)
    - cron: "0 12 * * 5"

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-ppe-nss
  UPSTREAM_REF: ppe-nss
  NSS_REPO: JuliusBairaktaris/nss-packages
  NSS_REF: ppe-nss
  TARGET: qualcommax/ipq807x
  KEEP: 7
  FEEDS: |
    src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;ppe-nss
    src-git amnezia https://github.com/this-username-has-been-taken/amneziawg-openwrt.git
  CUSTOM_FILES_PATH: files/

jobs:
  check_commits:
    name: Check for New Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new_commits: ${{ steps.check_new_commits.outputs.new_commits }}
      latest_commit_sha: ${{ steps.check_new_commits.outputs.latest_commit_sha }}
      nss_packages_repo_new_commits: ${{ steps.check_nss_packages_repo_new_commits.outputs.new_commits }}
      nss_packages_repo_latest_commit_sha: ${{ steps.check_nss_packages_repo_new_commits.outputs.latest_commit_sha }}
      config_new_commits: ${{ steps.check_config_repo_new_commits.outputs.new_commits }}
      config_commit_sha: ${{ steps.check_config_repo_new_commits.outputs.latest_commit_sha }}
    steps:
      - name: Check for New Commits in Remote Repository
        id: check_new_commits
        run: |
          latest_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits?sha=${{ env.UPSTREAM_REF }}&per_page=1" | jq -r '.[0].sha')
          last_built_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -oP 'Build Commit: \K\w+' || echo '')
          echo "new_commits=$([[ "$latest_commit_sha" != "$last_built_commit_sha" ]] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          echo "latest_commit_sha=$latest_commit_sha" >> "$GITHUB_OUTPUT"

          echo "Latest Commit SHA: $latest_commit_sha"
          echo "Last Built Commit SHA: $last_built_commit_sha"

      - name: Check for New Commits in NSS Packages Repository
        id: check_nss_packages_repo_new_commits
        run: |
          nss_packages_repo_latest_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ env.NSS_REPO }}/commits?sha=${{ env.NSS_REF }}&per_page=1" | jq -r '.[0].sha')
          nss_packages_repo_last_built_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -oP 'NSS Packages Commit: \K\w+' || echo '')
          echo "new_commits=$([[ "$nss_packages_repo_latest_commit_sha" != "$nss_packages_repo_last_built_commit_sha" ]] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          echo "latest_commit_sha=$nss_packages_repo_latest_commit_sha" >> "$GITHUB_OUTPUT"
          
          echo "Latest Commit SHA: $nss_packages_repo_latest_commit_sha"
          echo "Last Built Commit SHA: $nss_packages_repo_last_built_commit_sha"

      - name: Check for New Commits in Local Config Repository
        id: check_config_repo_new_commits
        run: |
          config_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/commits?sha=main&per_page=1" | jq -r '.[0].sha')
          last_built_config_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -oP 'Config Commit: \K\w+' || echo '')
          echo "new_commits=$([[ "$config_commit_sha" != "$last_built_config_commit_sha" ]] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          echo "latest_commit_sha=$config_commit_sha" >> "$GITHUB_OUTPUT"

          echo "Current Config SHA: $config_commit_sha"
          echo "Last Built Config SHA: $last_built_config_commit_sha"

  build:
    name: Build OpenWrt Firmware
    needs: check_commits
    if: needs.check_commits.outputs.new_commits == 'true' || needs.check_commits.outputs.nss_packages_repo_new_commits == 'true' || needs.check_commits.outputs.config_new_commits == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /var/lib/docker &
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          wait
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang llvm lld flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget mold tree ccache

      - name: Checkout Remote Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check_commits.outputs.latest_commit_sha }}

      - name: Apply Temporary Patch
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/openwrt/openwrt/pull/19071.patch -o /tmp/19071.patch
          if patch -p1 --dry-run --forward </tmp/19071.patch >/dev/null 2>&1; then
            echo "Applying OpenWrt PR #19071 (OpenSSL QUIC/KTLS)..."
            patch -p1 --forward </tmp/19071.patch
          elif patch -p1 --dry-run --reverse </tmp/19071.patch >/dev/null 2>&1; then
            echo "Skipping OpenWrt PR #19071 (already applied upstream)"
          else
            echo "::error::OpenWrt PR #19071 patch does not apply cleanly to the tree"
            exit 1
          fi
          rm -f /tmp/19071.patch

      - name: Checkout Current Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: "custom_repo"

      - name: Set reproducible-build env
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >> "$GITHUB_ENV"

      - name: Add Custom Feeds
        run: |
          sed -i '/telephony/d' feeds.conf.default || true
          sed -i '/video/d' feeds.conf.default || true
          printf "\n%s\n" "${{ env.FEEDS }}" >> feeds.conf.default

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a

      - name: Inject and Index Single luci-app-qca-ppe-qos Package
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch luci-app-ppe-qos https://github.com/JuliusBairaktaris/luci.git /tmp/luci-fork
          git -C /tmp/luci-fork sparse-checkout set applications/luci-app-qca-ppe-qos
          mkdir -p feeds/luci/applications
          cp -rf /tmp/luci-fork/applications/luci-app-qca-ppe-qos feeds/luci/applications/
          rm -rf /tmp/luci-fork
          ./scripts/feeds update -i luci

      - name: Apply Hardware PPE-QoS SQM Backend Patch
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/JuliusBairaktaris/Qualcommax_NSS_Builder/main/patches/feeds/ppe-nss/packages/0001-sqm-scripts-pin-the-fork-that-carries-hw_ppe.patch" -o /tmp/hw_ppe.patch
          if patch -p1 -d feeds/packages --dry-run --forward </tmp/hw_ppe.patch >/dev/null 2>&1; then
            echo "Applying sqm-scripts hw_ppe fork patch..."
            patch -p1 -d feeds/packages --forward </tmp/hw_ppe.patch
          elif patch -p1 -d feeds/packages --dry-run --reverse </tmp/hw_ppe.patch >/dev/null 2>&1; then
            echo "Skipping sqm-scripts hw_ppe fork patch (already applied)"
          else
            echo "::error::sqm-scripts hw_ppe fork patch does not apply cleanly to feeds/packages"
            exit 1
          fi
          rm -f /tmp/hw_ppe.patch

      - name: Fetch SmartDNS and LuCI App
        run: |
          rm -rf feeds/packages/net/smartdns feeds/luci/applications/luci-app-smartdns
          git clone --depth 1 https://github.com/pymumu/openwrt-smartdns.git feeds/packages/net/smartdns
          git clone --depth 1 https://github.com/pymumu/luci-app-smartdns.git feeds/luci/applications/luci-app-smartdns
          rm -rf feeds/packages/net/smartdns/.git feeds/luci/applications/luci-app-smartdns/.git
          ./scripts/feeds update -i packages luci

      - name: Install Feeds
        run: |
          ./scripts/feeds install -a
          ./scripts/feeds install -p luci -f luci-app-qca-ppe-qos
          mkdir -p package/feeds/luci
          ln -sf ../../../feeds/luci/applications/luci-app-qca-ppe-qos package/feeds/luci/luci-app-qca-ppe-qos

      - name: Download Official Ookla Speedtest Binary
        run: |
          mkdir -p custom_repo/files/usr/bin
          curl -fsSL --retry 3 https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-aarch64.tgz | tar xz -C custom_repo/files/usr/bin speedtest
          chmod +x custom_repo/files/usr/bin/speedtest

      - name: Pin ARM64 & IPQ8174 Kernel Feature Settings
        # Linksys MX4300 (IPQ8174) = Quad Cortex-A53 r0p4 @ 2.2 GHz (ARMv8.0 + AES/PMULL/SHA1/SHA2 CE + CRC32).
        # No LSE, SHA512/SHA3, SM3/SM4, PAC (v8.3), BTI (v8.5), MTE, AMU, RAS, or SVE in hardware.
        # On 6.18, SHA1/SHA256/ChaCha20/Poly1305 live in lib/crypto (and CRC32 in lib/crc) with
        # promptless *_ARCH=y backends auto-selected whenever their parent algorithms are enabled.
        run: |
          set -euo pipefail
          GEN_CFG=target/linux/generic/config-6.18
          CFG=target/linux/qualcommax/config-6.18
          SUB_CFG=target/linux/qualcommax/ipq807x/config-6.18
          [ -f "$CFG" ]
          [ -z "$(tail -c 1 "$CFG")" ] || echo "" >> "$CFG"

          PATTERN='^(# )?CONFIG_(CRYPTO_(AES|GHASH)_ARM64_CE(_BLK|_CCM)?|KERNEL_MODE_NEON|CRYPTO_(SHA1|SHA256|CHACHA20|POLY1305)|HW_RANDOM_IPQ_RNG|CRYPTO_DEV_QCE|RPS|XPS|RFS_ACCEL|BPF_JIT(_ALWAYS_ON)?|ARM64_LSE_ATOMICS|ARM64_SW_TTBR0_PAN|ARM_PMUV3|HW_PERF_EVENTS|ARM64_ERRATUM_8(43419|35769|32075|45719)|ARM64_(PTR_AUTH|BTI|SVE|MTE|AMU_EXTN|RAS_EXTN)|PREEMPT_NONE)(=| is not set)'

          echo "=== BEFORE (generic + qualcommax fragments) ==="
          for f in "$GEN_CFG" "$CFG" "$SUB_CFG"; do
            [ -f "$f" ] && grep -HE "$PATTERN" "$f" || true
          done

          set_kcfg() {
            sed -i -E "/^(# )?$1(=| is not set)/d" "$CFG"
            [ -f "$SUB_CFG" ] && sed -i -E "/^(# )?$1(=| is not set)/d" "$SUB_CFG"
            if [ "$2" = n ]; then
              echo "# $1 is not set" >> "$CFG"
            else
              echo "$1=$2" >> "$CFG"
            fi
          }

          # 1. ARMv8.0 Crypto Extensions (AES-ECB/CBC/CTR/XTS/CTS/CCM + GHASH/GCM via PMULL)
          set_kcfg CONFIG_CRYPTO_AES_ARM64_CE y
          set_kcfg CONFIG_CRYPTO_AES_ARM64_CE_BLK y
          set_kcfg CONFIG_CRYPTO_AES_ARM64_CE_CCM y
          set_kcfg CONFIG_CRYPTO_GHASH_ARM64_CE y

          # 2. Built-in SHA1/SHA256 & ChaCha20/Poly1305 (auto-selects ARM64 CE & NEON *_ARCH=y on 6.18)
          set_kcfg CONFIG_KERNEL_MODE_NEON y
          set_kcfg CONFIG_CRYPTO_SHA1 y
          set_kcfg CONFIG_CRYPTO_SHA256 y
          set_kcfg CONFIG_CRYPTO_CHACHA20 y
          set_kcfg CONFIG_CRYPTO_POLY1305 y

          # 3. Multi-Core Packet Steering & eBPF JIT (WireGuard / AmneziaWG / SQM / CAKE)
          set_kcfg CONFIG_RPS y
          set_kcfg CONFIG_XPS y
          set_kcfg CONFIG_RFS_ACCEL y
          set_kcfg CONFIG_BPF_JIT y
          set_kcfg CONFIG_BPF_JIT_ALWAYS_ON y
          set_kcfg CONFIG_PREEMPT_NONE y

          # 4. Cortex-A53 Architecture, Profiling Counters & Mandatory Silicon Errata
          set_kcfg CONFIG_ARM64_LSE_ATOMICS y
          set_kcfg CONFIG_ARM_PMUV3 y
          set_kcfg CONFIG_HW_PERF_EVENTS y
          set_kcfg CONFIG_ARM64_ERRATUM_843419 y
          set_kcfg CONFIG_ARM64_ERRATUM_835769 y
          set_kcfg CONFIG_ARM64_ERRATUM_832075 y
          set_kcfg CONFIG_ARM64_ERRATUM_845719 y

          # 5. Drop TTBR0 Page-Table Switching Overhead & Unused SoC / ARMv8.2–v9 Features
          set_kcfg CONFIG_ARM64_SW_TTBR0_PAN n
          set_kcfg CONFIG_HW_RANDOM_IPQ_RNG n
          set_kcfg CONFIG_CRYPTO_DEV_QCE n
          set_kcfg CONFIG_ARM64_PTR_AUTH n
          set_kcfg CONFIG_ARM64_BTI n
          set_kcfg CONFIG_ARM64_SVE n
          set_kcfg CONFIG_ARM64_MTE n
          set_kcfg CONFIG_ARM64_AMU_EXTN n
          set_kcfg CONFIG_ARM64_RAS_EXTN n

          echo "=== AFTER (qualcommax/config-6.18 overrides) ==="
          grep -HE "$PATTERN" "$CFG"

      - name: Configure Firmware Image
        run: |
          cp custom_repo/mx4300-ppe.config .config.orig
          cp custom_repo/mx4300-ppe.config .config
          make defconfig V=s
          sed -i 's/^CONFIG_FEED_nss=.*/# CONFIG_FEED_nss is not set/' .config || true
          sed -i 's/^CONFIG_FEED_amnezia=.*/# CONFIG_FEED_amnezia is not set/' .config || true
          sed -i '/export CCACHE_NOCOMPRESS/d' rules.mk || true

      - name: Pre-Flight Fail-Fast Assertion Audit
        run: |
          set -e
          ERRORS=0

          echo "===================================================="
          echo " RUNNING PRE-FLIGHT COMPILE INTEGRITY CHECKS"
          echo "===================================================="

          # 1. PHYSICAL FILE & PATCH APPLICATION INTEGRITY
          echo "--> Checking physical patch injection..."
          
          if git -C feeds/packages diff --quiet net/sqm-scripts/Makefile; then
            echo "::error::[PATCH FAILURE] net/sqm-scripts/Makefile was not modified by the hw_ppe fork patch!"
            ERRORS=$((ERRORS + 1))
          else
            echo " [OK] sqm-scripts Makefile successfully patched with hw_ppe fork"
          fi

          if [ ! -f "package/feeds/luci/luci-app-qca-ppe-qos/Makefile" ]; then
            echo "::error::[FEED SYMLINK FAILURE] luci-app-qca-ppe-qos/Makefile not found in package/feeds/luci/"
            ERRORS=$((ERRORS + 1))
          else
            echo " [OK] luci-app-qca-ppe-qos package registered"
          fi

          if [ ! -d "package/feeds/amnezia/amneziawg-tools" ] && [ ! -d "feeds/amnezia/amneziawg-tools" ]; then
            echo "::error::[FEED FAILURE] amneziawg-tools package missing from amnezia feed"
            ERRORS=$((ERRORS + 1))
          else
            echo " [OK] amneziawg-openwrt source present in feed"
          fi

          if [ ! -x "custom_repo/files/usr/bin/speedtest" ]; then
            echo "::error::[BINARY FAILURE] Ookla speedtest binary is missing or not executable in custom_repo/files/usr/bin/"
            ERRORS=$((ERRORS + 1))
          else
            echo " [OK] Ookla speedtest binary present and executable"
          fi

          if [ ! -f "package/feeds/packages/smartdns/Makefile" ]; then
            echo "::error::[FEED SYMLINK FAILURE] smartdns/Makefile not found in package/feeds/packages/"
            ERRORS=$((ERRORS + 1))
          else
            echo " [OK] smartdns package registered in feeds"
          fi

          if [ ! -f "package/feeds/luci/luci-app-smartdns/Makefile" ]; then
            echo "::error::[FEED SYMLINK FAILURE] luci-app-smartdns/Makefile not found in package/feeds/luci/"
            ERRORS=$((ERRORS + 1))
          else
            echo " [OK] luci-app-smartdns package registered in feeds"
          fi

          # 2. ESSENTIAL SYMBOLS INTEGRITY CHECK
          echo "--> Auditing essential core symbols in .config..."
          ESSENTIAL_SYMBOLS=(
            "CONFIG_TARGET_qualcommax=y"
            "CONFIG_TARGET_qualcommax_ipq807x=y"
            "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_linksys_mx4300=y"
            "CONFIG_PACKAGE_kmod-nss-wifi-drv=y"
            "CONFIG_PACKAGE_kmod-amneziawg=y"
            "CONFIG_PACKAGE_smartdns=y"
            "CONFIG_PACKAGE_luci-app-smartdns=y"
            "CONFIG_PACKAGE_luci-app-qca-ppe-qos=y"
            "CONFIG_PACKAGE_sqm-scripts=y"
          )

          for sym in "${ESSENTIAL_SYMBOLS[@]}"; do
            if ! grep -qxF "$sym" .config; then
              echo "::error::[CRITICAL MISSING] Required symbol absent from .config: $sym"
              ERRORS=$((ERRORS + 1))
            else
              echo " [OK] Essential symbol retained: $sym"
            fi
          done

          echo "--> Verifying defconfig kept all requested symbols..."
          DROPPED=0
          while IFS= read -r req; do
            if ! grep -qxF "$req" .config; then
              echo "::error::[DEFCONFIG DROPPED] Requested symbol omitted by defconfig: $req"
              DROPPED=$((DROPPED + 1))
              ERRORS=$((ERRORS + 1))
            fi
          done < <(grep -E '^CONFIG_[A-Za-z0-9_-]+=' .config.orig | awk -F= '{ last[$1] = $0 } END { for (s in last) print last[s] }' | grep -vE '=n$')
          if [ "$DROPPED" -eq 0 ]; then
            echo " [OK] All requested symbols in mx4300-ppe.config retained by defconfig"
          fi

          # 3. FORBIDDEN MBEDTLS & POLLUTING SYMBOLS (.config)
          echo "--> Auditing forbidden/polluting symbols in .config..."
          FORBIDDEN_SYMBOLS=(
            "CONFIG_FEED_nss=y"
            "CONFIG_FEED_amnezia=y"
            "CONFIG_PACKAGE_tc-full=y"
            "CONFIG_PACKAGE_wpad-basic-mbedtls=y"
            "CONFIG_PACKAGE_apk-mbedtls=y"
            "CONFIG_PACKAGE_libustream-mbedtls=y"
            "CONFIG_LIBCURL_MBEDTLS=y"
          )

          for sym in "${FORBIDDEN_SYMBOLS[@]}"; do
            if grep -Fxq "$sym" .config; then
              echo "::error::[SECURITY/FEED VIOLATION] Forbidden symbol enabled in .config: $sym"
              ERRORS=$((ERRORS + 1))
            else
              echo " [OK] Forbidden symbol clean: $sym"
            fi
          done

          # 4. FINAL VERDICT
          echo "===================================================="
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Pre-flight check failed with $ERRORS error(s). Halting build to save time."
            exit 1
          fi
          echo "All pre-flight assertions passed cleanly. Proceeding to dependency download and build."
          echo "===================================================="

      - name: Compute ccache key
        id: ccache
        run: |
          set -euo pipefail
          tree=$(git rev-parse HEAD:toolchain)
          sum=$({
            echo "$tree"
            grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL|GLIBC)_' .config
            gcc --version; as --version
          } | sha256sum | cut -c1-16)
          echo "prefix=ccache-${{ env.TARGET }}-$sum-" >> "$GITHUB_OUTPUT"

      - name: Mount RAM Disk for ccache
        run: |
          mkdir -p .ccache
          sudo mount -t tmpfs -o size=6G tmpfs .ccache
          df -h .ccache

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}

      - name: Print Configuration Summary
        run: |
          echo "===================================================="
          echo " COMPILED CONFIGURATION SUMMARY"
          echo "===================================================="
          grep -E '^CONFIG_TARGET_qualcommax' .config || true
          echo "Total active packages: $(grep -c '=y$' .config)"
          echo "Full .config will be saved to bin/targets/${{ env.TARGET }}/config.txt"
          echo "===================================================="

      - name: Include Custom Files
        run: |
          if [ -d "custom_repo/${{ env.CUSTOM_FILES_PATH }}" ]; then
            echo "Copying custom files from custom_repo/${{ env.CUSTOM_FILES_PATH }}..."
            mkdir -p files
            cp -r custom_repo/${{ env.CUSTOM_FILES_PATH }}/. files/
          else
            echo "No custom files directory found at custom_repo/${{ env.CUSTOM_FILES_PATH }}; skipping."
          fi

      - name: Restore OpenWrt download pool (dl/)
        uses: actions/cache/restore@v6
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default', 'custom_repo/mx4300-ppe.config') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ hashFiles('feeds.conf.default', 'custom_repo/mx4300-ppe.config') }}-
            dl-

      - name: Download Dependencies
        id: download
        run: |
          set -euo pipefail
          mkdir -p dl
          before=$(find dl -maxdepth 1 -type f 2>/dev/null | wc -l || echo 0)
          success=0
          for attempt in 1 2 3; do
            if make -j$(nproc) V=sc download; then
              success=1
              break
            fi
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done
          [ "$success" -eq 1 ] || { echo "::error::All download attempts failed"; exit 1; }
          after=$(find dl -maxdepth 1 -type f | wc -l)
          echo "grew=$([ "$after" -gt "$before" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Save OpenWrt download pool (dl/)
        if: steps.download.outputs.grew == '1'
        uses: actions/cache/save@v6
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default', 'custom_repo/mx4300-ppe.config') }}-${{ github.run_id }}

      - name: Build Firmware
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: "1"
          CCACHE_COMPRESSLEVEL: "1"
          CCACHE_MAXSIZE: "6G"
          CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros,file_macro,locale
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! make -j$(nproc) BUILD_LOG=1 world; then
            echo "::warning::Parallel build failed; retrying single-threaded for diagnostics"
            make -j1 V=sc world
          fi
          if [ -x "staging_dir/host/bin/ccache" ]; then
            echo "===================================================="
            echo " CCACHE STATS"
            echo "===================================================="
            CCACHE_DIR=.ccache staging_dir/host/bin/ccache -s
            echo "===================================================="
          fi

      - name: Organize Artifacts
        run: |
          cp .config bin/targets/${{ env.TARGET }}/config.txt
          tree bin/targets/${{ env.TARGET }} > bin/targets/${{ env.TARGET }}/file_list.txt
          rm -rf bin/targets/${{ env.TARGET }}/packages

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-images
          path: bin/targets/${{ env.TARGET }}/
          retention-days: 1

  release:
    name: Create a New Release
    needs: [build, check_commits]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware-images
          path: firmware

      - name: Display File Structure
        run: ls -R firmware

      - name: Generate Date and Release Identifiers
        run: |
          DATE_STR=$(date +%F)
          echo "RELEASE_DATE=$DATE_STR" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${DATE_STR}-run-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Generate Release Notes
        run: |
          cat <<EOF > release_notes.md
          Build Commit: ${{ needs.check_commits.outputs.latest_commit_sha }}
          NSS Packages Commit: ${{ needs.check_commits.outputs.nss_packages_repo_latest_commit_sha }}
          Config Commit: ${{ needs.check_commits.outputs.config_commit_sha }}
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware/*
          tag_name: ${{ env.RELEASE_TAG }}
          name: PPE-NSS Images ${{ env.RELEASE_DATE }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: ${{ env.KEEP }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
