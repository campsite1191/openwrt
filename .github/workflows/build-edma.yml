name: Build OpenWrt - EDMA

on:
  workflow_dispatch:
  schedule:
    - cron: "1 0 * * *"

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-nss-edma
  UPSTREAM_REF: nss-edma-rework
  NSS_REPO: JuliusBairaktaris/nss-packages
  NSS_REF: edma-nss
  TARGET: qualcommax/ipq807x
  KEEP: 2
  FEEDS: "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss"
  CUSTOM_FILES_PATH: files/

jobs:
  check_commits:
    name: Check for New Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new_commits: ${{ steps.check_new_commits.outputs.new_commits }}
      latest_commit_sha: ${{ steps.check_new_commits.outputs.latest_commit_sha }}
      nss_packages_repo_new_commits: ${{ steps.check_nss_packages_repo_new_commits.outputs.new_commits }}
      nss_packages_repo_latest_commit_sha: ${{ steps.check_nss_packages_repo_new_commits.outputs.latest_commit_sha }}
    steps:
      - name: Check for New Commits in Remote Repository
        id: check_new_commits
        run: |
          latest_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits?sha=${{ env.UPSTREAM_REF }}&per_page=1" | jq -r '.[0].sha')
          last_built_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -oP 'Build Commit: \K\w+' || echo '')
          echo "new_commits=$([[ "$latest_commit_sha" != "$last_built_commit_sha" ]] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          echo "latest_commit_sha=$latest_commit_sha" >> "$GITHUB_OUTPUT"

          echo "Latest Commit SHA: $latest_commit_sha"
          echo "Last Built Commit SHA: $last_built_commit_sha"

      - name: Check for New Commits in NSS Packages Repository
        id: check_nss_packages_repo_new_commits
        run: |
          nss_packages_repo_latest_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ env.NSS_REPO }}/commits?sha=${{ env.NSS_REF }}&per_page=1" | jq -r '.[0].sha')
          nss_packages_repo_last_built_commit_sha=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -oP 'NSS Packages Commit: \K\w+' || echo '')
          echo "new_commits=$([[ "$nss_packages_repo_latest_commit_sha" != "$nss_packages_repo_last_built_commit_sha" ]] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          echo "latest_commit_sha=$nss_packages_repo_latest_commit_sha" >> "$GITHUB_OUTPUT"
          
          echo "Latest Commit SHA: $nss_packages_repo_latest_commit_sha"
          echo "Last Built Commit SHA: $nss_packages_repo_last_built_commit_sha"

  build:
    name: Build OpenWrt Firmware
    needs: check_commits
    if: needs.check_commits.outputs.new_commits == 'true' || needs.check_commits.outputs.nss_packages_repo_new_commits == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /var/lib/docker
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      
      - name: Install Build Dependencies
        run: |
          sudo apt update 
          sudo apt upgrade -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget mold tree ccache

      - name: Checkout Remote Repository
        uses: actions/checkout@master
        with:
          fetch-depth: 1
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Apply Temporary Patch
        run: |
          curl -sL -o - https://patch-diff.githubusercontent.com/raw/openwrt/openwrt/pull/19071.patch | git apply -

      - name: Checkout Current Repository
        uses: actions/checkout@master
        with:
          fetch-depth: 1
          path: "custom_repo"

      - name: Install Go
        uses: actions/setup-go@master
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Set reproducible-build env
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >> "$GITHUB_ENV"

      - name: Add Custom Feeds
        run: |
          printf "\n%s\n" "${{ env.FEEDS }}" >> feeds.conf.default

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a

      - name: Add AmneziaWG Packages
        run: |
          git clone https://github.com/this-username-has-been-taken/amneziawg-openwrt.git package/amneziawg-openwrt
          rm -rf package/amneziawg-openwrt/Makefile
          sed -i 's#../../packages/lang/golang/golang-package.mk#../../../feeds/packages/lang/golang/golang-package.mk#g' package/amneziawg-openwrt/amneziawg-go/Makefile
          cat package/amneziawg-openwrt/amneziawg-go/Makefile
          
      - name: Update and Add SmartDNS Package
        run: |
          LATEST_COMMIT=$(git ls-remote https://github.com/pymumu/smartdns.git refs/heads/master | cut -f1)
          [ -z "$LATEST_COMMIT" ] && { echo "Failed to fetch SmartDNS commit hash"; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/pymumu/smartdns/master/package/openwrt/Makefile -o feeds/packages/net/smartdns/Makefile
          sed -i -E "s/^(PKG_SOURCE_VERSION:=).*/\1$LATEST_COMMIT/" feeds/packages/net/smartdns/Makefile
          sed -i "s/MIRROR_HASH:=.*/MIRROR_HASH:=skip/" feeds/packages/net/smartdns/Makefile       
          sed -i "s/DEPENDS:=/DEPENDS:=+zlib /g" feeds/packages/net/smartdns/Makefile
          cat feeds/packages/net/smartdns/Makefile

      - name: Update SmartDNS LuCI File
        run: |
          REPO_NAME="luci-app-smartdns"
          TARGET_DIR="$(pwd)/feeds/luci/applications/${REPO_NAME}"
          DOWNLOAD_URL="https://github.com/pymumu/${REPO_NAME}/archive/master.tar.gz"
          
          rm -rf "${TARGET_DIR}"
          mkdir -p "${TARGET_DIR}"
          curl -sL "${DOWNLOAD_URL}" | tar -xz -C "${TARGET_DIR}" --strip-components=1
          ls -R "${TARGET_DIR}"

      - name: Install Feeds
        run: |
          ./scripts/feeds install -a
          
      - name: Configure Firmware Image
        run: |
          mv custom_repo/mx4300-edma.config .config
          make defconfig V=s

      - name: Print .config
        run: |
          cat .config

      - name: Include Custom Files
        run: |
          if [ -d "custom_repo/${{ env.CUSTOM_FILES_PATH }}" ]; then
            echo "Copying custom files from custom_repo/${{ env.CUSTOM_FILES_PATH }}..."
            mkdir -p files
            cp -r custom_repo/${{ env.CUSTOM_FILES_PATH }}/. files/
          else
            echo "No custom files directory found at custom_repo/${{ env.CUSTOM_FILES_PATH }}; skipping."
          fi

      - name: Download Dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make -j$(($(nproc)+1)) V=sc download && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      - name: Prepare Dependencies
        run: |
          set -euo pipefail
          make -j$(($(nproc)+1)) V=sc prepare

      - name: Build Firmware
        run: |
          set -euo pipefail
          if ! make -j$(($(nproc)+1)) V=sc world; then
            echo "::warning::Parallel build failed; retrying single-threaded for diagnostics"
            make -j1 V=sc world
          fi

      - name: Organize Artifacts
        run: |
          cp .config bin/targets/${{ env.TARGET }}/config.txt
          tree bin/targets/${{ env.TARGET }} > bin/targets/${{ env.TARGET }}/file_list.txt
          rm -rf bin/targets/${{ env.TARGET }}/packages

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@master
        with:
          name: firmware-images
          path: bin/targets/${{ env.TARGET }}/
            
  release:
    name: Create a New Release
    needs: [build, check_commits]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@master
        with:
          name: firmware-images
          path: firmware

      - name: Display File Structure
        run: ls -R firmware

      - name: Generate Date and Release Identifiers
        run: |
          DATE_STR=$(date +%F)
          echo "RELEASE_DATE=$DATE_STR" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${DATE_STR}-run-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Generate Release Notes
        run: |
          cat <<EOF > release_notes.md
          Build Commit: ${{ needs.check_commits.outputs.latest_commit_sha }}
          NSS Packages Commit: ${{ needs.check_commits.outputs.nss_packages_repo_latest_commit_sha }}
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@master
        with:
          files: firmware/*
          tag_name: ${{ env.RELEASE_TAG }}
          name: EDMA Images ${{ env.RELEASE_DATE }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Old Releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: ${{ env.KEEP }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
